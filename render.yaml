services:
  - type: web
    name: examguard-api
    runtime: python
    pythonVersion: 3.11.0
    rootDir: .
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: MPLBACKEND
        value: "Agg"
      # Supabase configuration. Set secret values in Render's dashboard.
      - key: SUPABASE_URL
        value: "https://uymouuusicnnzhzdwznt.supabase.co"
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        value: "https://uymouuusicnnzhzdwznt.supabase.co/auth/v1/.well-known/jwks.json"
      # PostgreSQL configuration (Supabase pooler)
      - key: PG_HOST
        sync: false
      - key: PG_PORT
        value: "6543"
      - key: PG_USER
        sync: false
      - key: PG_DB
        value: "postgres"
      - key: PG_PASSWORD
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      # Security
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
